name: Seqsearch Rolling Restart

# Manual-only since the shared-state redesign (Aug 2026): job state lives in a shared
# redis + jobs PVC that survives restarts, so the old twice-daily restarts no longer
# clean anything up. Cache growth is to be handled by a dedicated cleanup job
# (jobs PVC + redis status keys) instead.
on:
  workflow_dispatch:

jobs:
  restart-k8s-seqsearch-deployment:
    name: "Restart seqsearch production deployments"
    uses: rcsb/devops-cicd-github-actions/.github/workflows/restart_k8s_deployment.yaml@master
    strategy:
      matrix:
        coast: [ 'west', 'east' ]
        path: [ 'a', 'b' ]
    with:
      namespace: production
      region: ${{ matrix.coast }} 
      deployment_name: production-rcsb-seqsearch-${{ matrix.path }}
      # covers a full deployment restart: 3 sequential pod cycles at ~7min each
      # (databases prebuilt in an init container since Aug 2026), plus margin
      timeout: '45m'
