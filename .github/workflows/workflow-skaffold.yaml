name: Run CI/CD Workflow

on:
  push:
  workflow_dispatch:

jobs:
  # Staging deployment
  skaffold_deploy_staging:
    name: "Skaffold deploy into staging namespace"
    if: (github.ref == github.event.repository.default_branch) && (github.event_name != 'pull_request')
    uses: rcsb/devops-cicd-github-actions/.github/workflows/deploy_skaffold.yaml@master
    with:
      namespace: staging
      profile: staging
  # Production deployment
  skaffold_deploy_production:
    name: Skaffold deploy into production environment"
    if: (github.ref == github.event.repository.default_branch) && (github.event_name != 'pull_request')
    needs:
      - skaffold_deploy_staging
    uses: rcsb/devops-cicd-github-actions/.github/workflows/deploy_skaffold.yaml@master
    with:
      namespace: production
      profile: production
