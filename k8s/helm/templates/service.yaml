{{- range tuple "a" "b" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm_chart.fullname" $ }}-redis-{{ . }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}-redis-{{ . }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "helm_chart.selectorLabels" $ | nindent 4 }}-redis-{{ . }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm_chart.fullname" $ }}-web-api-b
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}-web-api-b
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: api
  selector:
    {{- include "helm_chart.selectorLabels" $ | nindent 4 }}-web-api-b

{{- range tuple "a" "b" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm_chart.fullname" $ }}-webserver-{{ . }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}-webserver-{{ . }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "helm_chart.selectorLabels" $ | nindent 4 }}-webserver-{{ . }}
{{- end }}