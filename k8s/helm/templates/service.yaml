{{- range tuple "a" "b" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm_chart.fullname" $ }}-worker-{{ . }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}-worker-{{ . }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "helm_chart.selectorLabels" $ | nindent 4 }}-worker-{{ . }}
{{- end }}

{{- range tuple "a" "b" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm_chart.fullname" $ }}-redis-{{ . }}
  labels:
    app.kubernetes.io/instance: production-rcsb-seqsearch-redis-{{ . }}
    app.kubernetes.io/name: rcsb-seqsearch
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/instance: production-rcsb-seqsearch-redis-{{ . }}
    app.kubernetes.io/name: rcsb-seqsearch
{{- end }}

{{- range tuple "a" "b" }}
