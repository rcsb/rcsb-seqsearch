{{- if .Values.cleanup.enabled }}
{{- range tuple "a" "b" }}
{{- $path := . }}
{{- $args := dict "ctx" $ "path" $path }}
---
# The script lives in its own ConfigMap rather than in appConfigs on purpose: the
# deployments hash configmap.yaml into checksum/config, so putting it there would roll
# every seqsearch pod whenever the cleanup is tweaked. CronJob pods pick up changes
# here on their next run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm_chart.cleanupName" $args }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
    rcsb.org/path: {{ $path | quote }}
data:
  cleanup.sh: |
    #!/bin/sh
    # Prunes abandoned entries from a path's pending queue.
    #
    # Results are not pruned here any more: they live in redis and expire on
    # results.ttl, and job directories are scratch on a worker's own disk which
    # that worker deletes as soon as it has stored the result. There is no shared
    # volume left for this job to reach, which is the point.
    set -u
    REDIS="{{ include "helm_chart.redisName" $args }}"

    echo "$(date -Iseconds) cleanup path={{ $path }}"

    # A queued job's status expires on results.queue, so an entry still in the
    # pending set with no status key is one nobody is waiting for: clients give up
    # after ~30s (arches: 15s query timeout, 30s poll deadline). Left alone these
    # accumulate until the queue is deeper than the client timeout allows, at which
    # point every query fails even though the workers are keeping up.
    #
    # The queue holds only jobs no worker has taken (workers pop with ZPopMin), so
    # nothing in progress can be removed here.
    redis-cli -h "$REDIS" zrange mmseqs:pending 0 -1 | tr -d '\r' | sort > /tmp/queued.txt
    redis-cli -h "$REDIS" --scan --pattern 'mmseqs:status:*' 2>/dev/null | tr -d '\r' | sed 's|^mmseqs:status:||' | sort > /tmp/known.txt
    comm -23 /tmp/queued.txt /tmp/known.txt > /tmp/stale.txt
    n=$(wc -l < /tmp/stale.txt)
    if [ "$n" -gt 0 ]; then
      xargs -n 200 redis-cli -h "$REDIS" zrem mmseqs:pending < /tmp/stale.txt > /dev/null
    fi
    echo "queue: dropped $n abandoned of $(wc -l < /tmp/queued.txt) queued"
    echo "remaining: $(redis-cli -h "$REDIS" dbsize) redis keys, $(redis-cli -h "$REDIS" info memory | grep used_memory_human | tr -d '\r')"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "helm_chart.cleanupName" $args }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
    rcsb.org/path: {{ $path | quote }}
spec:
  schedule: {{ $.Values.cleanup.schedule | quote }}
  # a run that overruns its slot must not be joined by the next one: both would be
  # deleting the same keys and directories
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "helm_chart.labels" $ | nindent 12 }}
            rcsb.org/path: {{ $path | quote }}
        spec:
          restartPolicy: Never
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            - name: {{ . }}
          {{- end }}
          containers:
            - name: cleanup
              # the redis image already carries redis-cli and busybox find/comm/xargs,
              # and is pinned, so no extra image to maintain
              image: "{{ $.Values.image.redis.repository }}:{{ $.Values.image.redis.tag | default "latest" }}"
              imagePullPolicy: {{ $.Values.image.redis.pullPolicy }}
              command: [ "/bin/sh", "/opt/cleanup/cleanup.sh" ]
              volumeMounts:
                - mountPath: /opt/cleanup
                  name: script
                  readOnly: true
              resources:
                {{- toYaml $.Values.cleanup.resources | nindent 16 }}
          volumes:
            - name: script
              configMap:
                name: {{ include "helm_chart.cleanupName" $args }}
{{- end }}
{{- end }}
