{{- range tuple "a" "b" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helm_chart.fullname" $ }}-{{ . }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
    rcsb.org/path: {{ . | quote }}
spec:
  replicas: {{ $.Values.replicaCount }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit}}
  selector:
    matchLabels:
      {{- include "helm_chart.selectorLabels" $ | nindent 6 }}
      rcsb.org/path: {{ . | quote }}
  strategy:
    type: {{ $.Values.deploymentStrategy.type }}
    {{- if eq $.Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ $.Values.deploymentStrategy.maxSurge }}
      maxUnavailable: {{ $.Values.deploymentStrategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "helm_chart.selectorLabels" $ | nindent 8 }}
        rcsb.org/path: {{ . | quote }}
    spec:
      initContainers:
        - name: database-loader
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /opt/database-params
              name: {{ include "helm_chart.dbParamsName" $ }}
            {{- if $.Values.usePersistentVolume }}
            - mountPath: /opt/databases
              name: {{ include "helm_chart.pvname" $ }}-{{ . }}
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - >
              echo $POD_NAME
              if [ "${POD_NAME##*-}" = "0" ]; then
                echo "Loading DB directory";
                cp /opt/database-params/*.params /opt/databases;
                ls -lrt /opt/databases;
                echo "Pulling files from buildlocker";
                wget -O - "http://bl-{{ $.Values.buildlockerRegion | lower }}.rcsb.org/4-coastal/pdb_protein_sequence.fasta-{{ . | upper }}.gz" | gzip -d > /opt/databases/pdb_protein_sequence.fasta;
                wget -O - "http://bl-{{ $.Values.buildlockerRegion | lower }}.rcsb.org/4-coastal/pdb_dna_sequence.fasta-{{ . | upper }}.gz" | gzip -d > /opt/databases/pdb_dna_sequence.fasta;
                wget -O - "http://bl-{{ $.Values.buildlockerRegion | lower }}.rcsb.org/4-coastal/pdb_rna_sequence.fasta-{{ . | upper }}.gz" | gzip -d > /opt/databases/pdb_rna_sequence.fasta;
                wget -O - "http://bl-{{ $.Values.buildlockerRegion | lower }}.rcsb.org/4-coastal/models_protein_sequence.fasta-{{ . | upper }}.gz" | gzip -d > /opt/databases/models_protein_sequence.fasta;
                wget -O - "http://bl-{{ $.Values.buildlockerRegion | lower }}.rcsb.org/4-coastal/models_dna_sequence.fasta-{{ . | upper }}.gz" | gzip -d > /opt/databases/models_dna_sequence.fasta;
                wget -O - "http://bl-{{ $.Values.buildlockerRegion | lower }}.rcsb.org/4-coastal/models_rna_sequence.fasta-{{ . | upper }}.gz" | gzip -d > /opt/databases/models_rna_sequence.fasta;
                cp /opt/databases/* /opt/databases;
                echo "# we create another set of databases to search in PDB + CSM sequences at the same time, this ensures comparable scores between PDB and CSM sequences";
                cat /opt/databases/pdb_protein_sequence.fasta /opt/databases/models_protein_sequence.fasta > /opt/databases/pdb_and_models_protein_sequence.fasta;
                cat /opt/databases/pdb_dna_sequence.fasta /opt/databases/models_dna_sequence.fasta > /opt/databases/pdb_and_models_dna_sequence.fasta;
                cat /opt/databases/pdb_rna_sequence.fasta /opt/databases/models_rna_sequence.fasta > /opt/databases/pdb_and_models_rna_sequence.fasta;
                chown 1000 /opt/databases/*;
                sed -i "s/\$today/$(date -I)/g" /opt/databases/*params;
                echo "DB files loading complete";
              else
                echo "Pod name does not end with -0; skipping database loading.";
              fi
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name 
      containers:
        - name: mmseqs-web-redis
          image: "{{ $.Values.image.redis.repository }}:{{ $.Values.image.redis.tag | default "latest" }}"
          imagePullPolicy: {{ $.Values.image.redis.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - mountPath: /var/lib/redis
              name: redis-volume
          livenessProbe:
            tcpSocket:
              port: redis # named port
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 3
          resources:
            {{- toYaml $.Values.resources.redis | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
        - name: mmseqs-web-api
          image: "{{ $.Values.image.web_api.repository }}:{{ $.Values.image.web_api.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.web_api.pullPolicy }}
          command: [ "/sbin/tini" ]
          args: [ "-s", "--", "/usr/local/bin/mmseqs-web", "-server", "-config", "/etc/mmseqs-web/config.json" ]
          ports:
            - name: api
              containerPort: 3000
          volumeMounts:
            - mountPath: /opt/mmseqs-web/databases
              name: {{ include "helm_chart.pvname" $ }}-{{ . }}
            - mountPath: /opt/mmseqs-web/jobs
              name: jobs
            - name: {{ include "helm_chart.configmapName" $ }}
              mountPath: /etc/mmseqs-web/config.json
              subPath: config.json
              readOnly: true
          resources:
            {{- toYaml $.Values.resources.api | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name 
        - name: mmseqs-web-worker
          image: "{{ $.Values.image.web_worker.repository }}:{{ $.Values.image.web_worker.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.web_worker.pullPolicy }}
          command: [ "/sbin/tini" ]
          args: [ "-s", "--", "/usr/local/bin/mmseqs-web", "-worker", "-config", "/etc/mmseqs-web/config.json" ]
          volumeMounts:
            - mountPath: /opt/mmseqs-web/databases
              name: {{ include "helm_chart.pvname" $ }}-{{ . }}
            - mountPath: /opt/mmseqs-web/jobs
              name: jobs
            - name: {{ include "helm_chart.configmapName" $ }}
              mountPath: /etc/mmseqs-web/config.json
              subPath: config.json
              readOnly: true
          resources:
            {{- toYaml $.Values.resources.worker | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name 
        - name: mmseqs-web-webserver
          image: "{{ $.Values.image.web_webserver.repository }}:{{ $.Values.image.web_webserver.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.web_webserver.pullPolicy }}
          ports:
            - containerPort: {{ $.Values.service.port }}
              name: http
          volumeMounts:
            - name: {{ include "helm_chart.configmapName" $ }}
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            {{- toYaml $.Values.resources.webserver | nindent 12 }}
          readinessProbe:
            initialDelaySeconds: 1440
            timeoutSeconds: 5
            periodSeconds: 3
            httpGet:
              port: http
              path: /api/databases
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name 
        - name: query-warmer
          image: busybox:1.36
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - >
              echo $POD_NAME
              if [[ "${POD_NAME}" == *-0 ]]; then
                /opt/warm_up_query.sh
          volumeMounts:
            - mountPath: "/tmp/test.fasta"
              name: {{ include "helm_chart.configmapName" $ }}
              subPath: "test.fasta"
              readOnly: true
            - mountPath: "/opt/warm_up_query.sh"
              name: {{ include "helm_chart.configmapName" $ }}
              subPath: "warm_up_query.sh"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name 
      volumes:
        - name: redis-volume
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - "ReadWriteMany"
                storageClassName: {{ include "helm_chart.fullname" $ }}-ephemeral
                resources:
                  requests:
                    storage: {{ $.Values.ephemeralVolumes.redis_volume.sizeLimit }}
        - name: {{ include "helm_chart.pvname" $ }}-{{ . }}
          persistentVolumeClaim:
            claimName: {{ include "helm_chart.pvname" $ }}-{{ . }}
        - name: jobs
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - "ReadWriteMany"
                storageClassName: {{ include "helm_chart.fullname" $ }}-ephemeral
                resources:
                  requests:
                    storage: {{ $.Values.ephemeralVolumes.jobs.sizeLimit }}
        - name: {{ include "helm_chart.configmapName" $ }}
          configMap:
            name: {{ include "helm_chart.configmapName" $ }}
            defaultMode: 0744
        - name: {{ include "helm_chart.dbParamsName" $ }}
          configMap:
            name: {{ include "helm_chart.dbParamsName" $ }}
{{- end }}