{{- range tuple "a" "b" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm_chart.fullname" $ }}-{{ . }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
    rcsb.org/path: {{ . | quote }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $.Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm_chart.selectorLabels" $ | nindent 6 }}
      rcsb.org/path: {{ . | quote }}
  strategy:
    type: {{ $.Values.deploymentStrategy.type }}
    {{- if eq $.Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ $.Values.deploymentStrategy.maxSurge }}
      maxUnavailable: {{ $.Values.deploymentStrategy.maxUnavailable }}
    {{- end }}
  progressDeadlineSeconds: {{ $.Values.deploymentProgressTimeOut }}
  template:
    metadata:
      annotations:
        # Roll the pods whenever the config or database params change. Without this,
        # configmap-only merges never reach running pods (config files are subPath
        # mounts); the old twice-daily restarts used to mask that.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      labels:
        {{- include "helm_chart.selectorLabels" $ | nindent 8 }}
        rcsb.org/path: {{ . | quote }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "helm_chart.selectorLabels" $ | nindent 20 }}
                topologyKey: kubernetes.io/hostname
              weight: 1
      securityContext:
        fsGroup: 1000
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      initContainers:
        - name: database-loader
          image: harbor.devops.k8s.rcsb.org/dockerhub/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /opt/database-params
              name: {{ include "helm_chart.dbParamsName" $ }}
            - mountPath: /opt/databases
              name: databases
            - mountPath: {{ $.Values.persistentVolumeMountPath }}
              name: sequence-vol
              subPath: work-dir/sequence_files/{{ . }}
              readOnly: true
          command: ["/bin/sh", "-c"]
          args:
            - >
              echo "Loading DB directory";
              cp /opt/database-params/*.params /opt/databases;
              ls -lrt /opt/databases;
              echo "Pulling files from sequence-vol";
              gzip -dc {{ $.Values.persistentVolumeMountPath }}/pdb_protein_sequence.fasta.gz > /opt/databases/pdb_protein_sequence.fasta;
              gzip -dc {{ $.Values.persistentVolumeMountPath }}/pdb_dna_sequence.fasta.gz > /opt/databases/pdb_dna_sequence.fasta;
              gzip -dc {{ $.Values.persistentVolumeMountPath }}/pdb_rna_sequence.fasta.gz > /opt/databases/pdb_rna_sequence.fasta;
              gzip -dc {{ $.Values.persistentVolumeMountPath }}/models_protein_sequence.fasta.gz > /opt/databases/models_protein_sequence.fasta;
              gzip -dc {{ $.Values.persistentVolumeMountPath }}/models_dna_sequence.fasta.gz > /opt/databases/models_dna_sequence.fasta;
              gzip -dc {{ $.Values.persistentVolumeMountPath }}/models_rna_sequence.fasta.gz > /opt/databases/models_rna_sequence.fasta;
              echo "# we create another set of databases to search in PDB + CSM sequences at the same time, this ensures comparable scores between PDB and CSM sequences";
              cat /opt/databases/pdb_protein_sequence.fasta /opt/databases/models_protein_sequence.fasta > /opt/databases/pdb_and_models_protein_sequence.fasta;
              cat /opt/databases/pdb_dna_sequence.fasta /opt/databases/models_dna_sequence.fasta > /opt/databases/pdb_and_models_dna_sequence.fasta;
              cat /opt/databases/pdb_rna_sequence.fasta /opt/databases/models_rna_sequence.fasta > /opt/databases/pdb_and_models_rna_sequence.fasta;
              chown 1000 /opt/databases/*;
              sed -i "s/\$today/$(date -I)/g" /opt/databases/*params;
              echo "DB files loading complete";
        # Builds all mmseqs databases/indexes BEFORE the main containers start, so the
        # worker never consumes shared-queue jobs for databases it does not have yet.
        # See build_databases.sh in the values file for the full rationale.
        - name: database-builder
          image: "{{ $.Values.image.web_worker.repository }}:{{ $.Values.image.web_worker.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.web_worker.pullPolicy }}
          command: [ "/sbin/tini" ]
          args: [ "-s", "--", "/bin/sh", "/opt/mmseqs-web-init/build_databases.sh" ]
          volumeMounts:
            - mountPath: /opt/mmseqs-web/databases
              name: databases
            - name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
              mountPath: /etc/mmseqs-web/config-init.json
              subPath: config-init.json
              readOnly: true
            - name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
              mountPath: /opt/mmseqs-web-init/build_databases.sh
              subPath: build_databases.sh
              readOnly: true
          resources:
            {{- toYaml $.Values.resources.worker | nindent 12 }}
      containers:
        - name: mmseqs-web-api
          image: "{{ $.Values.image.web_api.repository }}:{{ $.Values.image.web_api.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.web_api.pullPolicy }}
          command: [ "/sbin/tini" ]
          args: [ "-s", "--", "/usr/local/bin/mmseqs-web", "-server", "-config", "/etc/mmseqs-web/config.json" ]
          ports:
            - name: api
              containerPort: 3000
          volumeMounts:
            - mountPath: /opt/mmseqs-web/databases
              name: databases
            - mountPath: /opt/mmseqs-web/jobs
              name: jobs
            - name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
              mountPath: /etc/mmseqs-web/config.json
              subPath: config.json
              readOnly: true
          # No probe here on purpose: this server listens on 127.0.0.1 only (see
          # server.address; binding the pod IP would expose the api unproxied, bypassing
          # nginx's upload limit), and the kubelet probes the pod IP, so httpGet and
          # tcpSocket cannot reach it. The image has no http client for an exec probe
          # either. The webserver's readiness probe covers this container instead: it
          # calls the api through nginx, so a wedged api takes the pod out of the
          # service. It cannot restart this container, though.
          resources:
            {{- toYaml $.Values.resources.api | nindent 12 }}
        - name: mmseqs-web-worker
          image: "{{ $.Values.image.web_worker.repository }}:{{ $.Values.image.web_worker.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.web_worker.pullPolicy }}
          command: [ "/sbin/tini" ]
          args: [ "-s", "--", "/usr/local/bin/mmseqs-web", "-worker", "-config", "/etc/mmseqs-web/config.json" ]
          volumeMounts:
            - mountPath: /opt/mmseqs-web/databases
              name: databases
            - mountPath: /opt/mmseqs-web/jobs
              name: jobs
            - name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
              mountPath: /etc/mmseqs-web/config.json
              subPath: config.json
              readOnly: true
          resources:
            {{- toYaml $.Values.resources.worker | nindent 12 }}
        - name: mmseqs-web-webserver
          image: "{{ $.Values.image.web_webserver.repository }}:{{ $.Values.image.web_webserver.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.web_webserver.pullPolicy }}
          ports:
            - containerPort: {{ $.Values.service.port }}
              name: http
          volumeMounts:
            - name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            {{- toYaml $.Values.resources.webserver | nindent 12 }}
          readinessProbe:
            # A 200 from /api/databases only proves nginx and the api are alive: the
            # endpoint lists just the databases marked COMPLETE, so a pod whose databases
            # are half built still passes it. Assert instead that the database searches
            # actually need is advertised, and look up a ticket, which is the cheapest
            # call that proves the api can reach its redis (a well-formed but unknown id
            # answers UNKNOWN; /api/databases alone reads params off disk and would pass
            # with redis down). Databases are prebuilt by the database-builder init
            # container, so this is usable shortly after the containers start.
            exec:
              command:
                - /bin/sh
                - -c
                # 127.0.0.1, never localhost: /etc/hosts maps localhost to ::1 as well,
                # and this image's wget tries that first, while nginx listens on IPv4
                # only. On v5's image it happened to pick IPv4 and this passed.
                - >
                  wget -qO- http://127.0.0.1/api/databases | grep -q '"path":"{{ $.Values.probes.requiredDatabase }}"' &&
                  wget -qO- http://127.0.0.1/api/ticket/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA > /dev/null
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            # static index: restarts a wedged nginx without depending on the api
            httpGet:
              port: http
              path: /
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
        - name: query-warmer
          image: busybox:1.37
          imagePullPolicy: Always
          command: [ "/opt/warm_up_query.sh" ]
          volumeMounts:
            - mountPath: "/tmp/test.fasta"
              name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
              subPath: "test.fasta"
              readOnly: true
            - mountPath: "/opt/warm_up_query.sh"
              name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
              subPath: "warm_up_query.sh"
      volumes:
        - name: databases
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - "ReadWriteMany"
                storageClassName: csi-cephfs-sc
                resources:
                  requests:
                    storage: {{ $.Values.ephemeralVolumes.databases.sizeLimit }}
        # Shared by all pods of THIS path (never across paths, which hold different
        # datasets): any pod of the path can serve any of its job's results, and the
        # results cache survives restarts. See redis.yaml for the matching PVC.
        - name: jobs
          persistentVolumeClaim:
            claimName: {{ include "helm_chart.jobsPvcName" (dict "ctx" $ "path" .) }}
        - name: sequence-vol
          persistentVolumeClaim:
            claimName: {{  $.Values.persistentVolumeClaimName }}
        - name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
          configMap:
            name: {{ include "helm_chart.configmapName" (dict "ctx" $ "path" .) }}
            defaultMode: 0744
        - name: {{ include "helm_chart.dbParamsName" $ }}
          configMap:
            name: {{ include "helm_chart.dbParamsName" $ }}
{{- end }}
