apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm_chart.fullname" . }}
  labels:
    {{- include "helm_chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "helm_chart.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
    {{- if eq .Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentStrategy.maxSurge }}
      maxUnavailable: {{ .Values.deploymentStrategy.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "helm_chart.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: database-loader
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /opt/database-params
              name: {{ include "helm_chart.dbParamsName" . }}
            - mountPath: /opt/database
              name: database
          command: ["/bin/sh", "-c"]
          args:
            - cp /opt/database-params/*.params /opt/database;
            - curl "{{ .Values.buildlockerURL }}/4-coastal/pdb_protein_sequence.fasta-{{ .Values.pool }}.gz" | gzip -d > /opt/databases/pdb_protein_sequence.fasta;
            - curl "{{ .Values.buildlockerURL }}/4-coastal/pdb_dna_sequence.fasta-{{ .Values.pool }}.gz" | gzip -d > /opt/databases/pdb_dna_sequence.fasta;
            - curl "{{ .Values.buildlockerURL }}/4-coastal/pdb_rna_sequence.fasta-{{ .Values.pool }}.gz" | gzip -d > /opt/databases/pdb_rna_sequence.fasta;
            - curl "{{ .Values.buildlockerURL }}/4-coastal/models_protein_sequence.fasta-{{ .Values.pool }}.gz" | gzip -d > /opt/databases/models_protein_sequence.fasta;
            - curl "{{ .Values.buildlockerURL }}/4-coastal/models_dna_sequence.fasta-{{ .Values.pool }}.gz" | gzip -d > /opt/databases/models_dna_sequence.fasta;
            - curl "{{ .Values.buildlockerURL }}/4-coastal/models_rna_sequence.fasta-{{ .Values.pool }}.gz" | gzip -d > /opt/databases/models_rna_sequence.fasta;
              # we create another set of databases to search in PDB + CSM sequences at the same time, this ensures comparable scores between PDB and CSM sequences
            - cat /opt/databases/pdb_protein_sequence.fasta /opt/databases/models_protein_sequence.fasta > /opt/databases/pdb_and_models_protein_sequence.fasta;
            - cat /opt/databases/pdb_dna_sequence.fasta /opt/databases/models_dna_sequence.fasta > /opt/databases/pdb_and_models_dna_sequence.fasta;
            - cat /opt/databases/pdb_rna_sequence.fasta /opt/databases/models_rna_sequence.fasta > /opt/databases/pdb_and_models_rna_sequence.fasta
      containers:
        - name: mmseqs-web-redis
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.redis.repository }}:{{ .Values.image.redis.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.image.redis.pullPolicy }}
          ports:
            - name: client
              containerPort: 6379
          volumeMounts:
            - mountPath: /var/lib/redis
              name: redis-volume
          livenessProbe:
            tcpSocket:
              port: client # named port
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: mmseqs-web-api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.web_api.repository }}:{{ .Values.image.web_api.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.web_api.pullPolicy }}
          command: ["-server", "-config /etc/mmseqs-web/config.json"]
          ports:
            - name: client
              containerPort: 3000
          volumeMounts:
            - mountPath: /opt/mmseqs-web/databases
              name: databases
            - mountPath: /opt/mmseqs-web/jobs
              name: jobs
            - name: {{ include "helm_chart.configmapName" . }}
              mountPath: /etc/mmseqs-web/config.json
              subPath: config.json
          livenessProbe:
            initialDelaySeconds: 1440 # Delay probe to allow server to init indices
            periodSeconds: 30
            failureThreshold: 6
            exec:
              command:
                - curl -X POST -F q=@/etc/mmseqs-web/test.fasta -F 'mode=accept' -F 'database[]=pdb_and_models_protein_sequence'  http://localhost:8877/api/ticket
                # This command tests liveness, but also warms up the service with one query. For some reason the first query is always very slow (which makes arches time out on it).
                # This guarantees that users don't see that problem.
          readinessProbe:
            initialDelaySeconds: 1440
            periodSeconds: 30
            failureThreshold: 6
            httpGet:
              port: 3000
              path: /
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: mmseqs-web-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.web_worker.repository }}:{{ .Values.image.web_worker.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.web_worker.pullPolicy }}
          command: [ "-worker", "-config /etc/mmseqs-web/config.json" ]
          volumeMounts:
            - mountPath: /opt/mmseqs-web/databases
              name: databases
            - mountPath: /opt/mmseqs-web/jobs
              name: jobs
            - name: {{ include "helm_chart.configmapName" . }}
              mountPath: /etc/mmseqs-web/config.json
              subPath: config.json
            - name: {{ include "helm_chart.configmapName" . }}
              mountPath: /etc/mmseqs-web/test.fasta
              subPath: test.fasta
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: mmseqs-web-webserver
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.web_webserver.repository }}:{{ .Values.image.web_webserver.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.web_webserver.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: {{ include "helm_chart.configmapName" . }}
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: redis-volume
          emptyDir:
            sizeLimit: {{ .Values.ephemeralVolumes.redis_volume.sizeLimit }}
        - name: databases
          emptyDir:
            sizeLimit: {{ .Values.ephemeralVolumes.databases.sizeLimit }}
        - name: jobs
          emptyDir:
            sizeLimit: {{ .Values.ephemeralVolumes.jobs.sizeLimit }}
        - name: {{ include "helm_chart.configmapName" . }}
          configMap:
            name: {{ include "helm_chart.configmapName" . }}
        - name: {{ include "helm_chart.dbParamsName" . }}
          configMap:
            name: {{ include "helm_chart.dbParamsName" . }}
