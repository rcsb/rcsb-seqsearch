{{- range tuple "a" "b" }}
{{- $path := . }}
{{- $args := dict "ctx" $ "path" $path }}
---
# Per-path redis holding all job state (status keys, pending queue) for every pod of
# this path. Shared within the path so any of its pods can answer any ticket poll
# (hence no session stickiness); never shared across paths, which hold different
# weekly datasets (see helm_chart.redisName in _helpers.tpl).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm_chart.redisName" $args }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
    rcsb.org/path: {{ $path | quote }}
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two redis instances must never write the same data dir
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "helm_chart.redisSelectorLabels" $args | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helm_chart.redisSelectorLabels" $args | nindent 8 }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ $.Values.image.redis.repository }}:{{ $.Values.image.redis.tag | default "latest" }}"
          imagePullPolicy: {{ $.Values.image.redis.pullPolicy }}
          # Results live in redis now, so it holds real data rather than a few
          # status strings. Reaching the container memory limit gets it OOM killed
          # and takes the path down; reaching maxmemory makes it evict instead, so
          # maxmemory is set below the limit.
          #
          # volatile-lru, never allkeys-lru: only finished jobs carry a TTL, so
          # eviction can drop results that were expiring anyway but never the
          # pending queue or the status of a job still queued or running. An evicted
          # result behaves exactly like an expired one, and the query simply runs
          # again if anyone asks for it.
          args:
            - --maxmemory
            - {{ $.Values.sharedState.redisMaxMemory | quote }}
            - --maxmemory-policy
            - volatile-lru
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            # /data is where the official redis image writes its RDB snapshots
            - mountPath: /data
              name: redis-data
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 3
          resources:
            {{- toYaml $.Values.resources.redis | nindent 12 }}
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "helm_chart.redisName" $args }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm_chart.redisName" $args }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
    rcsb.org/path: {{ $path | quote }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "helm_chart.redisSelectorLabels" $args | nindent 4 }}
---
# Persistent so that job state (including the COMPLETE-status cache index) survives
# redis pod rescheduling. Must stay consistent with this path's jobs volume: a cached
# COMPLETE status is only valid while the matching job dir exists on that volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "helm_chart.redisName" $args }}
  labels:
    {{- include "helm_chart.labels" $ | nindent 4 }}
    rcsb.org/path: {{ $path | quote }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-cephfs-sc
  resources:
    requests:
      storage: {{ $.Values.sharedState.redisVolumeSize }}
{{- end }}
