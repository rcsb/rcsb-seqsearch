    value: |-
      {
        "display": {
          "name": "PDB protein sequence (seqres)",
          "version": "$today",
          "default": true,
          "order": 0,
          "index": "-s 7.5",
          "search": "-s 7.5 --max-seqs 2000 --threads 2"
        }
      }
