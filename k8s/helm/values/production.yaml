# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Sized from measured throughput: one pod drains ~80 searches/min, and east peaked at
# ~180/min in Aug 2026 with 3 pods (~250/min), a margin thin enough that one stalled
# worker put the service underwater and built an unrecoverable queue. 5 gives ~400/min
# and still covers peak with one worker lost. NOTE: this applies to both paths, so the
# standby path runs the same number of pods without serving traffic.
replicaCount: 5

# seqsearch is not a great candidate for autoscaling; it takes too long to start up.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

# Needs to cover one pod's startup (init database build ~5min + ~1.5min to ready,
# measured 2026-08: ~7min total), not the whole rollout: the progress clock resets
# every time a new pod becomes ready. Was 6300 when the in-band index build took
# 25-30min per pod.
deploymentProgressTimeOut: 1800

imagePullSecrets: "harbor-docker-registry-conf"

# The Docker image reference which this Helm chart will run.
image:
  redis:
    repository: "harbor.devops.k8s.rcsb.org/dockerhub/library/redis"
    pullPolicy: IfNotPresent
    # Pin the patch version, do NOT use a floating tag like "alpine". Nodes cache
    # whatever a floating tag pointed at when they first pulled it, so different nodes
    # end up running different redis versions. That was harmless while redis data was
    # ephemeral, but now that job state is persisted an older redis can be scheduled
    # onto the RDB written by a newer one, fail with "Can't handle RDB format version",
    # and crash-loop, taking the whole path out of service.
    tag: "8.8.1-alpine"
  web_api:
    repository: "harbor.devops.k8s.rcsb.org/dockerhub/soedinglab/mmseqs2-app-backend"
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    #tag: ""
  web_worker:
    repository: "harbor.devops.k8s.rcsb.org/dockerhub/soedinglab/mmseqs2-app-backend"
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    #tag: ""
  web_webserver:
    repository: "harbor.devops.k8s.rcsb.org/dockerhub/soedinglab/mmseqs2-app-frontend"
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    #tag: ""

ephemeralVolumes:
  # This is where the sequence databases and indices are stored.
  databases:
    sizeLimit: 60Gi

# Per-path shared job state: EACH path (a and b) gets its own redis (status keys +
# pending queue) and its own RWX jobs volume (results cache), shared by all pods of that
# path. That is what lets any pod of a path answer any ticket poll or result fetch, so no
# client->pod stickiness is needed. State is never shared ACROSS paths: a and b hold
# different weekly datasets and ticket ids hash only the query and database names, so a
# common cache would serve one path's results for the other path's data.
# NOTE: mmseqs-app caches jobs in the jobs volume and nothing cleans it up yet. Unlike
#       the old per-pod ephemeral volumes, these SURVIVE restarts, so they grow until a
#       cleanup job lands (planned as a separate change). Sized generously as a bridge;
#       cleanup must delete the redis status key BEFORE the job dir (see cleanup design).
#       That cleanup also needs a per-path flush when a path receives new data, since
#       results cached against the previous dataset stay valid-looking otherwise.
# Sizes are PER PATH.
sharedState:
  redisVolumeSize: 10Gi
  jobsVolumeSize: 150Gi

persistentVolumeClaimName: "sequence-pvc"
persistentVolumeMountPath: "/opt/sequences"

deploymentStrategy:
  #https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  #Type is either RollingUpdate or Recreate
  type: "RollingUpdate"
  #For rolling update, what percentage of total pods can be created above desired amount
  maxSurge: 25%
  #For rolling update, what percentage of total pods can be brought down to update
  maxUnavailable: 25%

# securityContext sets the container security values of the Pod. These default values are the recommended
# values for all applications. Adjust as needed for your application purposes, but be aware of the security
# implications from these changes.
securityContext:
  readOnlyRootFilesystem: true

# service declares the type of Service resource to be created, as well as the target port of the Pod to send requests.
service:
  type: ClusterIP
  port: 80
  # Which path the main service (and so the ingress) points at. MUST stay empty here:
  # in production the path-operator injects the live path into the selector, reading it
  # from the namespace's live-path ConfigMap, and it is switched weekly. Set this only
  # in namespaces where the operator does not run (e.g. personal test namespaces), so
  # that traffic still reaches exactly one path as it does in production.
  livePath: ""

probes:
  # Database that must be advertised by the api for a pod to be considered ready.
  # /api/databases lists only the databases whose params say COMPLETE, so requiring a
  # named one turns a "200 OK" into a real statement about this pod being able to serve
  # searches. Use a database that is never empty (unlike the model DNA/RNA ones, which
  # have no sequences in some releases): this is also arches' default search target.
  requiredDatabase: "pdb_and_models_protein_sequence"

# ingress declares the Ingress resource to be created and allow access to the service from the external internet.
# Set ingress.enabled to true to create this Ingress resource. Double-check the host values for your application.
# No session affinity: job state (redis + jobs volume) is shared by all pods OF A PATH,
# so any pod of the live path can answer any request.


ingress:
  enabled: true
  className: haproxy
  annotations:
    cert-manager.io/cluster-issuer: rutgers-acme
    kubernetes.io/tls-acme: "true"
    haproxy.org/allow-list: >-
      128.6.158.0/23, 132.249.210.0/24, 132.249.213.0/24, 163.114.226.0/24, 163.114.225.0/24, 
      209.177.156.77/32, 147.75.68.120/29, 163.114.227.0/24, 163.114.228.0/24, 163.114.224.0/24, 147.75.66.200/29,
      163.114.230.0/24, 163.114.232.0/24
  hosts:
    - host: seqsearch.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch.east.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch.west.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch-east.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch-west.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - seqsearch.k8s.rcsb.org
        - seqsearch.west.k8s.rcsb.org
        - seqsearch.east.k8s.rcsb.org
        - seqsearch.rcsb.org
        - seqsearch-east.rcsb.org
        - seqsearch-west.rcsb.org
      secretName: seqsearch.k8s.rcsb.org

# Define resource limits for your application. Especially important if you enable autoscaling for this Helm chart.
# Deploy without limits first to test the application performance, then tune afterwards to ensure that autoscaling
# will work as expected.
resources:
  redis:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 1
      memory: 1Gi
  api:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 2
      memory: 1Gi
  worker:
    requests:
      cpu: 1
      memory: 45Gi
    limits:
      # mmseqs auto-detects the host's cores (96) for its thread count and is cgroup-unaware,
      # so a low limit means heavy throttling: searches run ~threads/limit times slower.
      cpu: 16
      memory: 90Gi
  webserver:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 1
      memory: 1Gi

# appConfigs defines ConfigMap resources which are mounted into the container environment as a file.
appConfigs:
  config.json:
    value: |-
      {
        "verbose": true,
        "server" : {
          "address"    : "127.0.0.1:3000",
          "dbmanagment": false,
          "cors"       : true
        },
        "paths" : {
          "databases"    : "/opt/mmseqs-web/databases",
          "results"      : "/opt/mmseqs-web/jobs",
          "temporary"    : "/tmp",
          "mmseqs"       : "/usr/local/bin/mmseqs"
        },
        "redis" : {
          "network"  : "tcp",
          "address"  : "{{ include "helm_chart.redisName" (dict "ctx" . "path" .path) }}:6379",
          "password" : "",
          "index"    : 0
        },
        "mail" : {
          "type"      : "null",
          "sender"    : "mail@example.org",
          "templates" : {
            "success" : {
              "subject" : "Done -- %s",
              "body"    : "Dear User,\nThe results of your submitted job are available now at https://search.mmseqs.com/queue/%s .\n"
            },
            "timeout" : {
              "subject" : "Timeout -- %s",
              "body"    : "Dear User,\nYour submitted job timed out. More details are available at https://search.mmseqs.com/queue/%s .\nPlease adjust the job and submit it again.\n"
            },
            "error"   : {
              "subject" : "Error -- %s",
              "body"    : "Dear User,\nYour submitted job failed. More details are available at https://search.mmseqs.com/queue/%s .\nPlease submit your job later again.\n"
            }
          }
        }
      }
  # Config for the database-builder init container: same as config.json but with a
  # container-local jobs dir, so the local-mode build queue never touches the shared
  # jobs volume or redis.
  config-init.json:
    value: |-
      {
        "verbose": true,
        "server" : {
          "address"    : "127.0.0.1:3000",
          "dbmanagment": false,
          "cors"       : true
        },
        "paths" : {
          "databases"    : "/opt/mmseqs-web/databases",
          "results"      : "/tmp/init-jobs",
          "temporary"    : "/tmp",
          "mmseqs"       : "/usr/local/bin/mmseqs"
        },
        "redis" : {
          "network"  : "tcp",
          "address"  : "localhost:6379",
          "password" : "",
          "index"    : 0
        },
        "mail" : {
          "type"      : "null",
          "sender"    : "mail@example.org",
          "templates" : {
            "success" : { "subject" : "-- %s", "body" : "%s" },
            "timeout" : { "subject" : "-- %s", "body" : "%s" },
            "error"   : { "subject" : "-- %s", "body" : "%s" }
          }
        }
      }
  # Builds every sequence database before the main containers start. The app builds
  # databases via IndexJobs through its job queue; with the shared redis queue those
  # jobs are deduplicated globally and each database would be built on only ONE pod
  # (leaving every other pod unable to serve searches for it). Building in an init
  # container in -local mode (private local queue) guarantees every pod has all
  # databases before its worker ever consumes a shared-queue job. CheckDatabase
  # skips databases whose files already exist, so the runtime index jobs become no-ops.
  build_databases.sh:
    value: |+
      #!/bin/sh
      # Waits for "status":"COMPLETE" in each .params file, which is what the app itself
      # writes once a database is fully usable and what the server checks when validating
      # a search ("Selected databases are not valid!" otherwise). Do NOT wait on the .idx
      # files instead: they appear before the status is written, so the builder would be
      # killed in between and the database would stay stuck at RUNNING forever.
      echo "# Building sequence databases via mmseqs-web local mode"
      mkdir -p /tmp/init-jobs
      /usr/local/bin/mmseqs-web -local -config /etc/mmseqs-web/config-init.json &
      PID=$!
      while true; do
        alldone=1
        for p in /opt/mmseqs-web/databases/*.params; do
          [ -e "$p" ] || continue
          base=${p%.params}
          # empty FASTA files (e.g. no model DNA/RNA sequences) are not indexed by the app
          [ -s "$base.fasta" ] || continue
          case "$(cat $p)" in
            *'"status":"COMPLETE"'*) ;;
            *'"status":"ERROR"'*)
              echo "# ERROR: indexing failed for $base";
              kill $PID 2>/dev/null; exit 1 ;;
            *) alldone=0 ;;
          esac
          [ "$alldone" = 1 ] || break
        done
        [ "$alldone" = 1 ] && break
        kill -0 $PID 2>/dev/null || { echo "# ERROR: mmseqs-web exited before databases were built"; exit 1; }
        sleep 10
      done
      echo "# All databases built and marked COMPLETE:"
      grep -o '"status":"[A-Z]*"' /opt/mmseqs-web/databases/*.params
      kill $PID
      wait $PID 2>/dev/null
      exit 0
  nginx.conf:
    value: |-
      server {
        listen 80 default;
      
        client_max_body_size 100M;
      
        access_log /dev/stdout;
        error_log /dev/stdout info;
      
        root /var/www/mmseqs-web;
        index index.html;
      
        location /api {
          rewrite ^/api(/.*) $1 break;
          # 127.0.0.1, not localhost: the Go backend only listens on IPv4, and nginx
          # otherwise tries [::1] first and logs a connection-refused error on every request
          proxy_pass        http://127.0.0.1:3000/;
      
          proxy_set_header  Host             $host;
          proxy_set_header  X-Real-IP        $remote_addr;
          proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
      
        location / {
          try_files $uri $uri/ /index.html;
        }
      
        location ~* \.(js|map|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|eot|ttf)$ {
          expires max;
          add_header Cache-Control public;
          log_not_found off;
        }
      
        location = /favicon.ico {
          log_not_found off;
          access_log off;
        }
      
        location = /robots.txt {
          allow all;
          log_not_found off;
          access_log off;
        }
      }
  test.fasta:
    value: |+
      >4HHB_1
      VLSPADKTNVKAAWGKVGAHAGEYGAEALERMFLSFPTTKTYFPHFDLSHGSAQVKGHGKKVADALTNAVAHVDDMPNALSALSDLHAHKLRVDPVNFKLLSHCLLVTLAAHLPAEFTPAVHASLDKFLASVSTVLTSKYR
  warm_up_query.sh:
    value: |+
      #!/bin/sh
      # Warm up seqsearch service with one query. The first query on a cold pod is slow (page cache); this guarantees that users don't see that problem.
      # Databases are prebuilt by the database-builder init container, so there is no need for the old fixed 1440s sleep: just wait until the api answers.
      echo "# Waiting for the api to be up before warming up"
      until wget -qO /dev/null http://localhost/api/databases 2>/dev/null; do sleep 5; done
      wget --post-data "q=@/tmp/test.fasta&mode=accept&database[]=pdb_and_models_protein_sequence" http://localhost/api/ticket
      sleep 60  # give time for query to execute. There's no need to look at results, just let it execute
      echo "# Done warming up"
      sleep 86400 # Sleep for 1 day before stopping and having container restart
