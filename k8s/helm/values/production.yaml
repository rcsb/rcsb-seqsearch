# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

# seqsearch is not a great candidate for autoscaling; it takes too long to start up.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

deploymentProgressTimeOut: 6300

imagePullSecrets: "harbor-docker-registry-conf"

# The Docker image reference which this Helm chart will run.
image:
  redis:
    repository: "harbor.devops.k8s.rcsb.org/dockerhub/library/redis"
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "alpine"
  web_api:
    repository: "harbor.devops.k8s.rcsb.org/dockerhub/soedinglab/mmseqs2-app-backend"
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    #tag: ""
  web_worker:
    repository: "harbor.devops.k8s.rcsb.org/dockerhub/soedinglab/mmseqs2-app-backend"
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    #tag: ""
  web_webserver:
    repository: "harbor.devops.k8s.rcsb.org/dockerhub/soedinglab/mmseqs2-app-frontend"
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    #tag: ""

ephemeralVolumes:
  redis_volume:
    sizeLimit: 10Gi
  # This is where the sequence databases and indices are stored.
  databases:
    sizeLimit: 60Gi
  # NOTE: mmseqs-app caches jobs in this volume. The app will go back to the volume to retrieve instead of recalculating.
  #       These cache jobs keep accumulating, there's no cleanup in place.
  #       We need quite a large size so that we can hold the cache for 24h. That's because we have an actions workflow that restarts every day.
  jobs:
    sizeLimit: 50Gi

persistentVolumeClaimName: "sequence-pvc"
persistentVolumeMountPath: "/opt/sequences"

deploymentStrategy:
  #https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  #Type is either RollingUpdate or Recreate
  type: "RollingUpdate"
  #For rolling update, what percentage of total pods can be created above desired amount
  maxSurge: 25%
  #For rolling update, what percentage of total pods can be brought down to update
  maxUnavailable: 25%

# securityContext sets the container security values of the Pod. These default values are the recommended
# values for all applications. Adjust as needed for your application purposes, but be aware of the security
# implications from these changes.
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# service declares the type of Service resource to be created, as well as the target port of the Pod to send requests.
service:
  type: ClusterIP
  port: 80

# ingress declares the Ingress resource to be created and allow access to the service from the external internet.
# Set ingress.enabled to true to create this Ingress resource. Double-check the host values for your application.
# The cookie affinity is set to keep sessions connected to the same pod


ingress:
  enabled: true
  className: haproxy
  annotations:
    cert-manager.io/cluster-issuer: rutgers-acme
    kubernetes.io/tls-acme: "true"
    haproxy.org/allow-list: >-
      128.6.158.0/23, 132.249.210.0/24, 132.249.213.0/24, 163.114.226.0/24, 163.114.225.0/24, 
      209.177.156.77/32, 147.75.68.120/29, 163.114.227.0/24, 163.114.228.0/24, 163.114.224.0/24, 147.75.66.200/29,
      163.114.230.0/24, 163.114.232.0/24
  hosts:
    - host: seqsearch.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch.east.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch.west.k8s.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch-east.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqsearch-west.rcsb.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - seqsearch.k8s.rcsb.org
        - seqsearch.west.k8s.rcsb.org
        - seqsearch.east.k8s.rcsb.org
        - seqsearch.rcsb.org
        - seqsearch-east.rcsb.org
        - seqsearch-west.rcsb.org
      secretName: seqsearch.k8s.rcsb.org

# Define resource limits for your application. Especially important if you enable autoscaling for this Helm chart.
# Deploy without limits first to test the application performance, then tune afterwards to ensure that autoscaling
# will work as expected.
resources:
  redis:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 1
      memory: 1Gi
  api:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 1
      memory: 1Gi
  worker:
    requests:
      cpu: 10m
      memory: 45Gi
    limits:
      cpu: 1
      memory: 90Gi
  webserver:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 1
      memory: 1Gi

# appConfigs defines ConfigMap resources which are mounted into the container environment as a file.
appConfigs:
  config.json:
    value: |-
      {
        "verbose": true,
        "server" : {
          "address"    : "localhost:3000",
          "dbmanagment": false,
          "cors"       : true
        },
        "paths" : {
          "databases"    : "/opt/mmseqs-web/databases",
          "results"      : "/opt/mmseqs-web/jobs",
          "temporary"    : "/tmp",
          "mmseqs"       : "/usr/local/bin/mmseqs"
        },
        "redis" : {
          "network"  : "tcp",
          "address"  : "localhost:6379",
          "password" : "",
          "index"    : 0
        },
        "mail" : {
          "type"      : "null",
          "sender"    : "mail@example.org",
          "templates" : {
            "success" : {
              "subject" : "Done -- %s",
              "body"    : "Dear User,\nThe results of your submitted job are available now at https://search.mmseqs.com/queue/%s .\n"
            },
            "timeout" : {
              "subject" : "Timeout -- %s",
              "body"    : "Dear User,\nYour submitted job timed out. More details are available at https://search.mmseqs.com/queue/%s .\nPlease adjust the job and submit it again.\n"
            },
            "error"   : {
              "subject" : "Error -- %s",
              "body"    : "Dear User,\nYour submitted job failed. More details are available at https://search.mmseqs.com/queue/%s .\nPlease submit your job later again.\n"
            }
          }
        }
      }
  nginx.conf:
    value: |-
      server {
        listen 80 default;
      
        client_max_body_size 100M;
      
        access_log /dev/stdout;
        error_log /dev/stdout info;
      
        root /var/www/mmseqs-web;
        index index.html;
      
        location /api {
          rewrite ^/api(/.*) $1 break;
          proxy_pass        http://localhost:3000/;
      
          proxy_set_header  Host             $host;
          proxy_set_header  X-Real-IP        $remote_addr;
          proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }
      
        location / {
          try_files $uri $uri/ /index.html;
        }
      
        location ~* \.(js|map|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|eot|ttf)$ {
          expires max;
          add_header Cache-Control public;
          log_not_found off;
        }
      
        location = /favicon.ico {
          log_not_found off;
          access_log off;
        }
      
        location = /robots.txt {
          allow all;
          log_not_found off;
          access_log off;
        }
      }
  test.fasta:
    value: |+
      >4HHB_1
      VLSPADKTNVKAAWGKVGAHAGEYGAEALERMFLSFPTTKTYFPHFDLSHGSAQVKGHGKKVADALTNAVAHVDDMPNALSALSDLHAHKLRVDPVNFKLLSHCLLVTLAAHLPAEFTPAVHASLDKFLASVSTVLTSKYR
  warm_up_query.sh:
    value: |+
      #!/bin/sh
      # Warm up seqsearch service with one query. For some reason the first query is always very slow (which makes arches time out on it). This guarantees that users don't see that problem.
      echo "# Will now warm up the server with 1 query. This will take 25 minutes"
      sleep 1440  # give time for server to init indices
      # NOTE (Sebastian, 2022): the following line reports 'Selected databases are not valid!' if databases are still initializing (with the service still up and running but maybe in an unhealthy state) - I've increased the wait time above to hopefully avoid that
      wget --post-data "q=@/tmp/test.fasta&mode=accept&database[]=pdb_and_models_protein_sequence" http://localhost/api/ticket
      sleep 60  # give time for query to execute. There's no need to look at results, just let it execute
      echo "# Done warming up"
      sleep 86400 # Sleep for 1 day before stopping and having container restart
